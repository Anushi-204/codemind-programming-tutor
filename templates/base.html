<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CodeMind{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --card:     #16161f;
      --border:   #232334;
      --accent:   #7c6ef5;
      --accent2:  #f5836e;
      --accent3:  #52e3c2;
      --text:     #e8e8f0;
      --muted:    #6b6b82;
      --radius:   14px;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- NAV ---------- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 0;
      padding: 0 2rem;
      height: 60px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-size: 1.25rem; font-weight: 800; letter-spacing: -1px;
      color: var(--text);
      margin-right: auto;
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 0.25rem; align-items: center; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      padding: 0.4rem 0.85rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.02em;
      transition: color 0.18s, background 0.18s;
    }
    .nav-links a:hover { color: var(--text); background: var(--border); }
    .nav-links a.active { color: var(--accent); }
    .btn-nav {
      background: var(--accent); color: #fff !important;
      padding: 0.4rem 1rem !important; border-radius: 8px;
      font-weight: 700 !important;
    }
    .btn-nav:hover { background: #9588f8 !important; }

    /* ---------- MAIN WRAPPER ---------- */
    main {
      padding-top: 80px;
      min-height: 100vh;
    }

    /* ---------- BUTTONS ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.4rem; border-radius: 10px;
      font-family: var(--sans); font-weight: 700; font-size: 0.875rem;
      border: none; cursor: pointer; transition: all 0.18s;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #9588f8; transform: translateY(-1px); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: #e05; color: #fff; }
    .btn-danger:hover { background: #f02060; }

    /* ---------- CARDS ---------- */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }

    /* ---------- INPUTS ---------- */
    input, select, textarea {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 0.7rem 1rem; font-family: var(--sans);
      font-size: 0.9rem; width: 100%;
      transition: border-color 0.18s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,110,245,0.15);
    }
    label { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

    /* ---------- RESPONSE BOX ---------- */
    .response-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
      font-family: var(--mono); font-size: 0.85rem; line-height: 1.75;
      white-space: pre-wrap; word-break: break-word; color: var(--text);
      min-height: 80px;
    }
    .response-box code, .response-box pre {
      background: rgba(124,110,245,0.08);
      border: 1px solid rgba(124,110,245,0.2);
      border-radius: 6px; padding: 0.2em 0.5em;
      font-family: var(--mono);
    }

    /* ---------- PULSE LOADER ---------- */
    .loader { display: none; align-items: center; gap: 6px; padding: 1rem 0; }
    .loader.active { display: flex; }
    .loader-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); animation: pulse 1.2s ease infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ---------- GRID HELPERS ---------- */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ---------- BADGE ---------- */
    .badge {
      display: inline-flex; align-items: center;
      padding: 0.2rem 0.6rem; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge-accent { background: rgba(124,110,245,0.15); color: var(--accent); }
    .badge-green  { background: rgba(82,227,194,0.12); color: var(--accent3); }
    .badge-orange { background: rgba(245,131,110,0.12); color: var(--accent2); }

    /* ---------- SECTION TITLE ---------- */
    .section-title {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }
    .section-sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }

    /* ---------- GLOW BG ---------- */
    .glow-bg {
      position: fixed; pointer-events: none; z-index: 0;
      width: 500px; height: 500px; border-radius: 50%;
      filter: blur(120px); opacity: 0.04;
      background: var(--accent);
      top: -150px; right: -150px;
    }
    .glow-bg2 {
      position: fixed; pointer-events: none; z-index: 0;
      width: 400px; height: 400px; border-radius: 50%;
      filter: blur(100px); opacity: 0.04;
      background: var(--accent2);
      bottom: -100px; left: -100px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="glow-bg"></div>
  <div class="glow-bg2"></div>

  {% if session.user %}
  <nav>
    <a class="nav-logo" href="/"><span>//</span> CodeMind</a>
    <div class="nav-links">
      <a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Learn</a>
      <a href="/editor" {% if request.path == '/editor' %}class="active"{% endif %}>Editor</a>
      <a href="/logout" class="btn-nav">Logout</a>
    </div>
  </nav>
  {% endif %}

  <main>{% block content %}{% endblock %}</main>

  {% block scripts %}{% endblock %}
</body>
</html>
